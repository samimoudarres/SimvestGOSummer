# Deploy on Render: https://dashboard.render.com → New → Blueprint → connect this repo.
# Set MASSIVE_API_KEY and DATABASE_URL (Supabase) in the Render dashboard (required).
services:
  - type: web
    name: simvest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Persistent disk kept for rollback / seed files; primary data is Supabase when DATABASE_URL is set.
    disk:
      name: simvest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIMVEST_SERVE_DIST
        value: "true"
      - key: PORT
        value: "3001"
      - key: SIMVEST_DATA_DIR
        value: /var/data
      - key: MASSIVE_API_KEY
        sync: false
      - key: SIMVEST_ADMIN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
